<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.jpeg">
<link rel="apple-touch-icon" href="icon.jpeg">
<meta name="theme-color" content="#3f7bff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-modal">
      <h2>Стиль оформлення</h2>
      <label class="theme-option"><input type="radio" name="theme" value="ai-generic"> AI-generic</label>
      <label class="theme-option"><input type="radio" name="theme" value="board"> Табло вильотів</label>
      <label class="theme-option"><input type="radio" name="theme" value="pass"> Посадковий талон</label>
      <label class="theme-option"><input type="radio" name="theme" value="comic"> Комікс</label>
      <button id="apply-theme-btn" class="apply-btn">Застосувати</button>
    </div>
  </div>

  <div id="pull-indicator" class="pull-indicator"></div>

  <div class="app">
    <header class="hero">
      <button id="settings-btn" class="settings-btn" aria-label="Налаштування">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="refresh-btn" class="refresh-btn" aria-label="Оновити">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11A8 8 0 0 0 4.6 8M4 5v4h4"/>
          <path d="M4 13a8 8 0 0 0 15.4 3M20 19v-4h-4"/>
        </svg>
      </button>
      <div class="hero-title" id="hero-weekday"></div>
      <div class="hero-date" id="hero-date"></div>
    </header>

    <nav class="menu">
      <button class="menu-btn" data-action="today"><span class="ico">📅</span><span class="lbl">Сьогодні</span></button>
      <button class="menu-btn" data-action="tomorrow"><span class="ico">📆</span><span class="lbl">Завтра</span></button>
      <button class="menu-btn" data-action="week"><span class="ico">🗓️</span><span class="lbl">До кінця тижня</span></button>
      <button class="menu-btn" data-action="child"><span class="ico">🧒</span><span class="lbl">Дитина</span></button>
      <button class="menu-btn" data-action="weekday"><span class="ico">📌</span><span class="lbl">День тижня</span></button>
      <button class="menu-btn" data-action="events"><span class="ico">🎉</span><span class="lbl">Події</span></button>
    </nav>

    <div id="child-menu" class="child-menu hidden"></div>
    <div id="weekday-menu" class="child-menu hidden"></div>

    <div id="events-panel" class="events-panel hidden">
      <div class="events-range-row">
        <label class="events-date-label">Від
          <input type="date" id="events-start">
        </label>
        <label class="events-date-label">До
          <input type="date" id="events-end">
        </label>
        <button id="events-show-btn" class="apply-btn apply-btn-inline">Показати</button>
      </div>

      <div id="events-list"></div>

      <button id="toggle-add-event-btn" class="add-event-toggle" type="button">+ Додати подію</button>

      <form id="add-event-form" class="add-event-form hidden">
        <div id="event-form-title" class="event-form-title">Нова подія</div>
        <label>Кого стосується
          <select id="event-who"></select>
        </label>
        <label>Дата
          <input type="date" id="event-date" required>
        </label>
        <label>Час початку <span class="opt-label">(необов'язково)</span>
          <input type="time" id="event-begin">
        </label>
        <label>Час закінчення <span class="opt-label">(необов'язково)</span>
          <input type="time" id="event-end">
        </label>
        <label>Опис
          <textarea id="event-description" rows="2" required></textarea>
        </label>
        <div class="event-form-actions">
          <button type="button" id="cancel-event-btn" class="btn-cancel">Скасувати</button>
          <button type="submit" class="apply-btn">Зберегти</button>
        </div>
      </form>
    </div>

    <main id="content" class="content"></main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js?v=15"></script>
</body>
</html>
