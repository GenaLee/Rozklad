<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Розклад</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.jpeg">
<link rel="apple-touch-icon" href="icon.jpeg">
<meta name="theme-color" content="#3f7bff">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-title" id="hero-weekday"></div>
      <div class="hero-date" id="hero-date"></div>
    </header>

    <nav class="menu">
      <button class="menu-btn" data-action="today"><span class="ico">📅</span><span class="lbl">Сьогодні</span></button>
      <button class="menu-btn" data-action="tomorrow"><span class="ico">📆</span><span class="lbl">Завтра</span></button>
      <button class="menu-btn" data-action="week"><span class="ico">🗓️</span><span class="lbl">До кінця тижня</span></button>
      <button class="menu-btn" data-action="child"><span class="ico">🧒</span><span class="lbl">Дитина</span></button>
    </nav>

    <div id="child-menu" class="child-menu hidden"></div>

    <main id="content" class="content"></main>
  </div>

  <script src="script.js?v=3"></script>
</body>
</html>
